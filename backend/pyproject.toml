[project]
name = "bestbuild-api"
version = "0.1.0"
description = "BestBuild — AI-powered construction marketplace API (MVP) + marketplace agent"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "dotenv>=0.9.9",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "langchain>=1.3.14",
    "langchain-groq>=1.1.3",
    "langgraph>=1.2.9",
    # --- Database ---
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    # --- Auth (AWS Cognito) ---
    "boto3>=1.34",
    "python-jose[cryptography]>=3.3",
    # --- Lambda deployment ---
    "mangum>=0.17",
]

[tool.uv]
# Managed with uv: `uv sync` then `uv run uvicorn app.main:app --reload`
