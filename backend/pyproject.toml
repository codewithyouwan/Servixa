[project]
name = "bestbuild-api"
version = "0.1.0"
description = "BestBuild — AI-powered construction marketplace API (MVP) + marketplace agent"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "dotenv>=0.9.9",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "langchain>=1.3.14",
    "langchain-groq>=1.1.3",
    "langgraph>=1.2.9",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pydantic-settings>=2.4",
    "pyjwt>=2.9",
    "bcrypt>=4.2",
    "pgvector>=0.3",
]

[tool.uv]
# Managed with uv: `uv sync` then `uv run uvicorn app.main:app --reload`
